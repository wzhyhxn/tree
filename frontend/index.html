<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>校园植物地图</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ============================================
       The Herbarium — Campus Plant Map
       Design system for 中国人民大学
       ============================================ */

    :root {
      /* Color */
      --color-bg:            #FCFCFA;
      --color-surface:       #FFFFFF;
      --color-text:          #1A1A1A;
      --color-text-secondary:#706E6B;
      --color-text-tertiary: #9D9A96;
      --color-accent:        #1F5C3A;
      --color-accent-hover:  #163F28;
      --color-accent-soft:   #ECF4EE;
      --color-warm:          #C2852E;
      --color-warm-soft:     #FDF6EC;
      --color-border:        #EBE9E5;
      --color-border-light:  #F2F0EC;
      --color-danger:        #D14343;
      --color-danger-soft:   #FEF2F2;
      --color-overlay:       rgba(18, 18, 18, 0.45);

      /* Typography */
      --font-display:  Georgia, 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      --font-body:     -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      --font-latin:    Georgia, 'Times New Roman', serif;
      --font-mono:     'SF Mono', 'Cascadia Code', 'Consolas', monospace;

      /* Scale */
      --text-xs:   0.75rem;     /* 12px */
      --text-sm:   0.8125rem;   /* 13px */
      --text-base: 0.9375rem;   /* 15px */
      --text-md:   1.0625rem;   /* 17px */
      --text-lg:   1.25rem;     /* 20px */
      --text-xl:   1.5rem;      /* 24px */
      --text-2xl:  1.875rem;    /* 30px */

      /* Spacing */
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;

      /* Shape */
      --radius-sm: 6px;
      --radius:    10px;
      --radius-lg: 14px;
      --radius-xl: 18px;

      /* Shadow */
      --shadow-sm:  0 1px 2px rgba(0,0,0,0.04);
      --shadow:     0 2px 12px rgba(0,0,0,0.06);
      --shadow-md:  0 8px 30px rgba(0,0,0,0.08);
      --shadow-lg:  0 16px 48px rgba(0,0,0,0.12);

      /* Layout */
      --nav-height: 3rem;
      --sidebar-width: 14rem;
    }

    /* Reset */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--color-text);
      background: var(--color-bg);
      line-height: 1.6;
    }

    /* Typography */
    h1, h2, h3, h4 {
      font-family: var(--font-display);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }
    .latin {
      font-family: var(--font-latin);
      font-style: italic;
      color: var(--color-text-secondary);
    }
    .mono {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
    }

    /* Links */
    a { color: inherit; text-decoration: none; }

    /* Focus */
    :focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--color-text-tertiary); }

    /* ─── Shared Components ─── */

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .card-elevated {
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
      padding: 0.5rem 1rem;
      border: none; border-radius: var(--radius);
      font-family: var(--font-body); font-size: var(--text-sm); font-weight: 600;
      cursor: pointer; transition: all 0.15s ease;
      white-space: nowrap;
      line-height: 1.4;
    }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--color-accent); color: #fff;
    }
    .btn-primary:hover { background: var(--color-accent-hover); }

    .btn-ghost {
      background: transparent; color: var(--color-text-secondary);
    }
    .btn-ghost:hover { background: var(--color-accent-soft); color: var(--color-accent); }

    .btn-danger {
      background: var(--color-danger-soft); color: var(--color-danger);
    }
    .btn-danger:hover { background: var(--color-danger); color: #fff; }

    .btn-warm {
      background: transparent; color: var(--color-warm);
    }
    .btn-warm:hover { background: var(--color-warm-soft); }

    .input,
    .input-field {
      width: 100%; padding: 0.6rem 0.8rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      font-family: var(--font-body); font-size: var(--text-sm);
      color: var(--color-text); background: var(--color-surface);
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input:focus,
    .input-field:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-soft);
    }
    .input::placeholder,
    .input-field::placeholder { color: var(--color-text-tertiary); }

    textarea.input,
    textarea.input-field {
      resize: vertical; min-height: 5rem;
      line-height: 1.6;
    }

    .tag {
      display: inline-flex; align-items: center; gap: 0.25rem;
      padding: 0.2rem 0.6rem;
      border-radius: 100px;
      background: var(--color-accent-soft);
      color: var(--color-accent);
      font-size: var(--text-xs); font-weight: 600;
    }
    .tag-warm {
      background: var(--color-warm-soft);
      color: var(--color-warm);
    }

    .divider {
      height: 1px; background: var(--color-border-light);
      border: none; margin: 0;
    }

    /* Nav blur */
    .nav-blur {
      background: rgba(252,252,250,0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border-light);
    }

    /* Skeleton loading */
    .skeleton {
      background: linear-gradient(90deg, var(--color-border-light) 25%, #F9F8F5 50%, var(--color-border-light) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius);
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed var(--color-border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--color-bg);
    }
    .upload-zone:hover {
      border-color: var(--color-accent);
      background: var(--color-accent-soft);
    }

    /* Overlay backdrop */
    .overlay-backdrop {
      position: fixed; inset: 0; z-index: 40;
      background: var(--color-overlay);
      display: flex; align-items: center; justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Checkbox (custom radio/check style) */
    .check-circle {
      width: 1rem; height: 1rem;
      border-radius: 50%;
      border: 2px solid var(--color-border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .check-circle.active {
      border-color: var(--color-accent);
      background: var(--color-accent);
    }
    .check-circle.active::after {
      content: '';
      width: 0.35rem; height: 0.35rem;
      border-radius: 50%;
      background: #fff;
    }

    .check-square {
      width: 1rem; height: 1rem;
      border-radius: 3px;
      border: 2px solid var(--color-border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
      cursor: pointer;
    }
    .check-square.active {
      border-color: var(--color-accent);
      background: var(--color-accent);
    }
    .check-square.active::after {
      content: '✓';
      color: #fff; font-size: 0.6rem; font-weight: 700;
    }

    /* ─── Mobile responsive ─── */
    @media (max-width: 768px) {
      :root {
        --sidebar-width: 100%;
      }
    }

    /* ─── Reduced motion ─── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
