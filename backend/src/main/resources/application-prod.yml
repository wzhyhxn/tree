# ── 生产环境配置 ──
# 所有敏感值通过环境变量注入，不写死

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME:plant_mvp}?stringtype=unspecified
    username: ${DB_USER}
    password: ${DB_PASSWORD}

# 阿里云 OSS（通过 env 注入，无默认值 → 未设置则启动失败）
storage:
  oss:
    endpoint: ${OSS_ENDPOINT}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket: ${OSS_BUCKET}
    cdn-domain: ${OSS_CDN_DOMAIN}
