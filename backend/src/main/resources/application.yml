spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:plant_mvp}?stringtype=unspecified
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        spatial:
          enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

amap:
  key: ${AMAP_KEY:your-amap-key}
  security-code: ${AMAP_SECURITY_CODE:your-amap-security-code}

server:
  port: 8080
